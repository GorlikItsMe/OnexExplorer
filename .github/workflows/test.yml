name: test

on:
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu) build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qtbase5-dev qttools5-dev-tools \
            freeglut3-dev libglu1-mesa-dev mesa-common-dev \
            python3 python3-pip

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests pillow pytest

      - name: Run E2E tests (CLI)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u -m pytest -v -s --tb=short

  windows:
    name: Windows build (MSYS2 MinGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-freeglut

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Prepare E2E portable folder
        run: |
          set -eux
          mkdir -p e2e_exe
          cp build/OnexExplorer.exe e2e_exe/
          cd e2e_exe
          if [ -x "$MINGW_PREFIX/bin/windeployqt.exe" ]; then
            "$MINGW_PREFIX/bin/windeployqt.exe" --release --compiler-runtime OnexExplorer.exe
          else
            "$MINGW_PREFIX/bin/windeployqt-qt5.exe" --release --compiler-runtime OnexExplorer.exe
          fi
          cd ..
          shopt -s nullglob
          for dll in "$MINGW_PREFIX"/bin/libfreeglut*.dll; do
            cp "$dll" e2e_exe/
          done

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow pytest

      - name: Run E2E tests (CLI)
        shell: pwsh
        env:
          ONEX_BIN: ${{ github.workspace }}/e2e_exe/OnexExplorer.exe
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          $mingwBin = Join-Path "${{ steps.msys2.outputs['msys2-location'] }}" "mingw64\bin"
          # Append (do not prepend): MinGW's python is also in mingw64/bin and would shadow setup-python.
          $env:PATH = "$env:PATH;$mingwBin"
          & "${{ steps.python.outputs['python-path'] }}" -u -m pytest -v -s --tb=short

