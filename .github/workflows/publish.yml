name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    name: Linux (Ubuntu) build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qtbase5-dev qttools5-dev-tools \
            freeglut3-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OnexExplorer-linux-x86_64
          path: build/OnexExplorer

  windows:
    name: Windows build (MSYS2 MinGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-freeglut

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OnexExplorer-windows-x86_64
          path: build/OnexExplorer.exe

  release:
    name: GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OnexExplorer-linux-x86_64/OnexExplorer
            dist/OnexExplorer-windows-x86_64/OnexExplorer.exe

