name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    name: Linux (Ubuntu) AppImage
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qtbase5-dev qttools5-dev-tools \
            freeglut3-dev libglu1-mesa-dev mesa-common-dev \
            patchelf imagemagick binutils file wget

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OnexExplorer-linux-x86_64
          path: OnexExplorer-*-x86_64.AppImage

  windows:
    name: Windows (${{ matrix.msystem }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - msystem: MINGW64
            mingw_arch: x86_64
            artifact_suffix: x86_64
          - msystem: MINGW32
            mingw_arch: i686
            artifact_suffix: i686
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            mingw-w64-${{ matrix.mingw_arch }}-toolchain
            mingw-w64-${{ matrix.mingw_arch }}-cmake
            mingw-w64-${{ matrix.mingw_arch }}-ninja
            mingw-w64-${{ matrix.mingw_arch }}-qt5
            mingw-w64-${{ matrix.mingw_arch }}-qt5-tools
            mingw-w64-${{ matrix.mingw_arch }}-angleproject
            mingw-w64-${{ matrix.mingw_arch }}-freeglut

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Prepare portable folder
        run: |
          set -eux
          mkdir -p release
          cp build/OnexExplorer.exe release/
          cd release
          if [ -x "$MINGW_PREFIX/bin/windeployqt.exe" ]; then
            "$MINGW_PREFIX/bin/windeployqt.exe" --release --compiler-runtime OnexExplorer.exe
          else
            "$MINGW_PREFIX/bin/windeployqt-qt5.exe" --release --compiler-runtime OnexExplorer.exe
          fi
          cd ..
          shopt -s nullglob
          for dll in "$MINGW_PREFIX"/bin/libfreeglut*.dll; do
            cp "$dll" release/
          done

      - name: Zip release (PowerShell)
        shell: pwsh
        run: |
          $zip = "OnexExplorer-windows-${{ matrix.artifact_suffix }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path release/* -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OnexExplorer-windows-${{ matrix.artifact_suffix }}
          path: OnexExplorer-windows-${{ matrix.artifact_suffix }}.zip

  release:
    name: GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OnexExplorer-linux-x86_64/*.AppImage
            dist/OnexExplorer-windows-x86_64/*.zip
            dist/OnexExplorer-windows-i686/*.zip
